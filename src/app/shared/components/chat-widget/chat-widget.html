<div class="chat-widget">

  <!-- გახსნის ღილაკი -->
  <button class="chat-toggle" (click)="toggleChat()" title="AI Assistant" aria-label="Toggle chat">
    <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
      <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/>
    </svg>
    @if (hasNewNotification()) {
      <span class="chat-toggle__dot"></span>
    }
  </button>

  <!-- ჩატის ფანჯარა -->
  <div class="chat-window" [class.chat-window--open]="isChatOpen()">

    <div class="chat-header">
      <span>🚂 STEP TRAINS AI</span>
      <button class="chat-header__close" (click)="toggleChat()" aria-label="Close chat">✕</button>
    </div>

    <div class="chat-messages">
      @for (msg of messages(); track $index) {
        <div class="chat-message" [class.chat-message--user]="msg.type === 'user'">
          {{ msg.text }}
        </div>
      }

      @if (isThinking()) {
        <div class="chat-message chat-message--thinking">
          <span></span><span></span><span></span>
        </div>
      }
    </div>

    @if (!authState.isLoggedIn()) {
      <div class="chat-login-prompt">
        <span>ჯავშნისთვის საჭიროა ავტორიზაცია</span>
        <button (click)="goToLogin()">შესვლა</button>
      </div>
    }

    <div class="chat-input-area">
      <input
        type="text"
        placeholder="მაგ: თბილისი-ბათუმი მატარებლები..."
        [value]="inputValue()"
        (input)="inputValue.set($any($event.target).value)"
        (keydown.enter)="sendMessage()"
        [disabled]="isSending()">

      <button
        class="chat-send-btn"
        (click)="sendMessage()"
        [disabled]="isSending() || !inputValue().trim()">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
          <path d="M2 21l21-9L2 3v7l15 2-15 2z"/>
        </svg>
      </button>
    </div>

  </div>

</div>
