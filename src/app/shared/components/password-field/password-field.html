<div class="password-field">

  <div class="password-input-wrapper">

    <input
      [type]="showPassword ? 'text' : 'password'"
      [value]="password"
      (input)="onPasswordChange($any($event.target).value)"
      placeholder="Create password"
      class="password-input"
    >

    <button
      type="button"
      class="password-toggle"
      (click)="togglePassword()"
      aria-label="Show or hide password"
    >

      @if (showPassword) {
        <!-- Eye OFF -->
        <svg
          width="18"
          height="18"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
        >
          <path d="M3 3l18 18"></path>
          <path d="M10.58 10.58a2 2 0 0 0 2.83 2.83"></path>
          <path d="M9.88 4.24A9.77 9.77 0 0 1 12 4c5 0 9 8 9 8a16.5 16.5 0 0 1-2.04 3.19"></path>
          <path d="M6.61 6.61C4.62 8.08 3 12 3 12s4 8 9 8a9.77 9.77 0 0 0 2.12-.24"></path>
        </svg>
      } @else {
        <!-- Eye -->
        <svg
          width="18"
          height="18"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
        >
          <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"></path>
          <circle cx="12" cy="12" r="3"></circle>
        </svg>
      }

    </button>

  </div>


  @if (password.length > 0) {

    <div class="password-strength">

      <div class="strength-header">
        <span>Password strength</span>

        <span class="strength-text">
          {{ strengthText }}
        </span>
      </div>


      <div class="strength-bars">

        @for (bar of [1, 2, 3, 4]; track bar) {

          <span
            class="strength-bar"
            [class.active]="passwordStrength >= bar"
          ></span>

        }

      </div>


      <div class="password-requirements">

        <p [class.valid]="password.length >= 6">
          <span>✓</span>
          At least 6 characters
        </p>

        <p [class.valid]="/[A-Z]/.test(password)">
          <span>✓</span>
          One uppercase letter
        </p>

        <p [class.valid]="/[0-9]/.test(password)">
          <span>✓</span>
          One number
        </p>

        <p [class.valid]="/[^A-Za-z0-9]/.test(password)">
          <span>✓</span>
          One special character
        </p>

      </div>

    </div>

  }

</div>
