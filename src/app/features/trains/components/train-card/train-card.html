<div class="train-card-container">
@for(train of items; track train.id){
  <div class="train-card" (click)="goToDetails(train.id)">
    <img [src]="train.thumbnail" [alt]="train.name">
    <h3>{{train.name}}</h3>
    <p>{{'TRAIN_CARD.TRAIN_NUMBER'| translate}}: {{train.number}}</p>
    <p>{{'TRAIN_CARD.SEATS' | translate}}: {{train.totalSeats}}</p>
  </div>
}
</div>
